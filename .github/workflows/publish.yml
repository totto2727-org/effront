name: Publish to npm

on:
  push:
    branches: [main]

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'totto2727-org/effront'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
      - uses: totto2727-org/monorepo/.github/actions/setup-typescript@main
      - name: Build public packages
        uses: ./.github/actions/build-workspace
      - name: Publish public packages
        uses: totto2727-org/monorepo/.github/actions/publish-npm@main
        with:
          working-directory: .
          filters: "./packages/*"
