name: Deploy documentation

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  deployments: write

concurrency:
  # Deploy and cleanup for one PR must not reconcile the same state concurrently.
  group: docs-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

env:
  ALCHEMY_STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}

jobs:
  deploy:
    # Never execute fork or Dependabot revisions with deployment credentials.
    if: >-
      github.event.action != 'closed' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) &&
        github.event.pull_request.user.login != 'dependabot[bot]') ||
       (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.event_name == 'pull_request' && 'docs-preview' || 'docs-production' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Confirm current PR revision
        id: current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          let allowed = true;
          if (event.pull_request) {
            const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/pulls/${event.pull_request.number}`, {
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: "application/vnd.github+json" },
            });
            if (!response.ok) throw new Error(`Cannot check current PR: ${response.status}`);
            const current = await response.json();
            if (!["open", "closed"].includes(current.state) || typeof current.head?.sha !== "string") throw new Error("Invalid current PR response");
            allowed = current.state === "open" && current.head.sha === event.pull_request.head.sha;
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `allowed=${allowed}\n`);
          if (!allowed) console.log("Skipping a closed PR or superseded revision");
          NODE
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
        if: steps.current.outputs.allowed == 'true'
      - uses: totto2727-org/monorepo/.github/actions/setup-typescript@main
        if: steps.current.outputs.allowed == 'true'
      - name: Build workspace packages
        if: steps.current.outputs.allowed == 'true'
        uses: ./.github/actions/build-workspace
      - name: Deploy documentation
        if: steps.current.outputs.allowed == 'true'
        id: deploy
        shell: bash
        working-directory: app/docs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          eval "$(nix print-dev-env "$GITHUB_WORKSPACE#default")"
          vp exec alchemy deploy --stage "$ALCHEMY_STAGE" --yes
          url="$(vp exec alchemy state read "effront-docs/$ALCHEMY_STAGE/output" --backend cloudflare --no-input --log-level none \
            | node -e '
                let input = "";
                process.stdin.on("data", (chunk) => { input += chunk; });
                process.stdin.on("end", () => {
                  // Cloudflare credential refresh prints a progress task before the JSON.
                  const jsonStart = input.lastIndexOf("\n{");
                  const value = JSON.parse(input.slice(jsonStart < 0 ? 0 : jsonStart + 1));
                  const url = new URL(value.url);
                  const hostnameAllowed = process.env.ALCHEMY_STAGE === "production"
                    ? url.hostname === "effront.totto2727.dev"
                    : /^pr-[1-9][0-9]*$/.test(process.env.ALCHEMY_STAGE ?? "") && url.hostname.endsWith(".workers.dev");
                  if (url.protocol !== "https:" || url.username || url.password || url.port || !hostnameAllowed) {
                    throw new Error("Alchemy did not return the expected documentation URL");
                  }
                  process.stdout.write(url.origin);
                });
              ')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "[Documentation ($ALCHEMY_STAGE)]($url)" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    environment:
      name: docs-preview
      deployment: false
    steps:
      # Cleanup executes trusted default-branch code, not the closed PR revision.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Confirm PR remains closed
        id: current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/pulls/${event.pull_request.number}`, {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: "application/vnd.github+json" },
          });
          if (!response.ok) throw new Error(`Cannot check current PR: ${response.status}`);
          const current = await response.json();
          if (!["open", "closed"].includes(current.state) || typeof current.head?.sha !== "string") throw new Error("Invalid current PR response");
          const allowed = current.state === "closed" && current.head.sha === event.pull_request.head.sha;
          appendFileSync(process.env.GITHUB_OUTPUT, `allowed=${allowed}\n`);
          if (!allowed) console.log("Skipping cleanup for a reopened PR");
          NODE
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
        if: steps.current.outputs.allowed == 'true'
      - uses: totto2727-org/monorepo/.github/actions/setup-typescript@main
        if: steps.current.outputs.allowed == 'true'
      - name: Build workspace packages
        if: steps.current.outputs.allowed == 'true'
        uses: ./.github/actions/build-workspace
      - name: Destroy documentation preview
        if: steps.current.outputs.allowed == 'true'
        shell: bash
        working-directory: app/docs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ ! "$ALCHEMY_STAGE" =~ ^pr-[1-9][0-9]*$ ]]; then
            echo "Refusing to destroy a non-PR stage" >&2
            exit 1
          fi
          eval "$(nix print-dev-env "$GITHUB_WORKSPACE#default")"
          vp exec alchemy destroy --stage "$ALCHEMY_STAGE" --yes
          echo "Removed documentation preview $ALCHEMY_STAGE" >> "$GITHUB_STEP_SUMMARY"
