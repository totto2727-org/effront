name: Deploy documentation

on:
  push:

permissions:
  contents: read
  deployments: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'docs-production' || 'docs-preview' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
      - uses: totto2727-org/monorepo/.github/actions/setup-typescript@main
      - name: Build workspace packages
        uses: ./.github/actions/build-workspace
      - name: Select deployment stage
        id: stage
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            stage=production
          else
            stage="preview-$(node -p 'require("node:crypto").createHash("sha256").update(process.env.GITHUB_REF).digest("hex").slice(0, 12)')"
          fi
          echo "name=$stage" >> "$GITHUB_OUTPUT"
      - name: Deploy documentation
        id: deploy
        uses: totto2727-org/monorepo/.github/actions/deploy-alchemy@main
        with:
          working-directory: app/docs
          stack-name: effront-docs
          stage: ${{ steps.stage.outputs.name }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
